[workspace]
resolver = "2"
members = ["bullet-physics-adapter"]

[workspace.dependencies]
abi_stable = "0.11"
newviso-compat-abi = { path = "../../NewViso/crates/newviso-compat-abi" }
newviso-physics-api = { path = "../../NewViso/crates/newviso-physics-api" }
rsbullet-core = "=0.3.4"
nalgebra = "0.34.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1


[patch.crates-io]
rsbullet_sys = { path = "vendor/rsbullet_sys" }
rsbullet-core = { path = "vendor/rsbullet-core" }
