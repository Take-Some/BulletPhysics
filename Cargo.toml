[workspace]
resolver = "2"
members = ["bullet-physics-adapter"]

[workspace.package]
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
abi_stable = "0.11"
newengine-plugin-api = { package = "newengine-plugin-kit", path = "../../NewEngine/neocore2/crates/newengine-plugin-kit" }
newengine-physics-api = { path = "../../NewEngine/neocore2/crates/newengine-physics-api" }
rsbullet-core = "=0.3.4"
nalgebra = "0.34.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[profile.release]
debug = 0
strip = "symbols"
lto = "thin"
codegen-units = 1

