[package]
name = "engine-physics-bullet"
version = "0.1.0"
build = "build.rs"
edition = "2021"
description = "North Star engine.physics provider route backed by Bullet Physics"
license = "Proprietary"

[dependencies]
newengine-plugin-api = { workspace = true }
newengine-physics-api = { workspace = true }
rsbullet-core = { workspace = true }
nalgebra = { workspace = true }
abi_stable = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[package.metadata.northstar.provider]
route = "engine.physics.bullet"
install_name = "bullet-physics"
implements = "engine.physics"

[lib]
name = "bullet_physics"
crate-type = ["cdylib"]

[build-dependencies]
embed-resource = "3.0.6"

[dev-dependencies]
newengine-contract-conformance = { path = "../../../NewEngine/neocore2/crates/newengine-contract-conformance" }
